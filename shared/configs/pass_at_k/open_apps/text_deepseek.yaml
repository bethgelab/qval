context_name: open_apps_recovery_som_text

# Backend
backends_config_path: shared/configs/backends.yaml
backend_name: deepseek_v32_react

# Task selection — all 8 OpenApps tasks, one trajectory bucket per task
task_indices: [0, 1, 2, 3, 4, 5, 6, 7]
shuffle_tasks: false

# Pass@k parameters
samples_per_task: 5
k_values: [1, 3, 5]

# Collection
batch_size: 4
seed: 42

# Output
output_path: data/pass_at_k/open_apps/text_deepseek.json

# Optional
max_history_turns: 3
max_aborted_points: 0.3
debug: false
