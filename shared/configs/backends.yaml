        sampling:
            temperature: 0.6
            top_p: 0.95
            top_k: 20
            max_tokens: 14336
            thinking_budget: 6144
            thinking_budget_soft_ratio: 0.85
            early_stopping_suffix: true
            second_elicitation: true
            second_elicitation_max_tokens: 2048

    qwen35_9_react_vision_or:
        type: openrouter
        model: qwen/qwen3.5-9b
        max_model_len: 262144
        enable_thinking: false
        max_concurrency: 32
        rate_limit_wait: 61
        connect_timeout: 30.0
        api_max_retries: 5
        # Vision: pin to providers that accept many images per request
        # (Together caps low). Uniform pin across all vision backends.
