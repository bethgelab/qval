backends:
    # ---------------------------------------------------------------------------
    # LLM eval/actor backends: Qwen 3.5 (9B/27B/35B-A3B/122B-A10B) + Gemma 4
    # (26B-A4B/31B). Per model, all combinations of:
    #   type      : openrouter (`_or`) vs vllm_singularity (`_vllm`)
    #   modality  : text vs vision (vision pins OR providers; vLLM ignores it,
    #               so vLLM has no modality token)
    #   reasoning : react (enable_thinking false) vs thinking
    #   codegen   : orthogonal flag (larger max_tokens); text-only
    # Naming: {model}_{reasoning}[_codegen]_{modality}_{type}.
    # ---------------------------------------------------------------------------

    # ---- qwen35_9 ----

    qwen35_9_react_text_or:
        type: openrouter
        model: qwen/qwen3.5-9b
        max_model_len: 262144
        enable_thinking: false
        max_concurrency: 32
        rate_limit_wait: 61
        connect_timeout: 30.0
        api_max_retries: 5
        sampling:
            temperature: 0.1
            top_p: 1.0
            top_k: 20
            max_tokens: 4096

    qwen35_9_react_codegen_text_or:
        type: openrouter
        model: qwen/qwen3.5-9b
        max_model_len: 262144
        enable_thinking: false
        max_concurrency: 32
        rate_limit_wait: 61
        connect_timeout: 30.0
        api_max_retries: 5
        sampling:
            temperature: 0.1
            top_p: 1.0
            top_k: 20
            max_tokens: 14336

    qwen35_9_thinking_text_or:
        type: openrouter
        model: qwen/qwen3.5-9b
        max_model_len: 262144
        enable_thinking: true
        max_concurrency: 32
        rate_limit_wait: 61
        connect_timeout: 30.0
        api_max_retries: 5
        sampling:
            temperature: 0.6
            top_p: 0.95
            top_k: 20
            max_tokens: 8192
            thinking_budget: 6144
            thinking_budget_soft_ratio: 0.85
            early_stopping_suffix: true
            second_elicitation: true
            second_elicitation_max_tokens: 512

    qwen35_9_thinking_codegen_text_or:
        type: openrouter
        model: qwen/qwen3.5-9b
        max_model_len: 262144
        enable_thinking: true
        max_concurrency: 32
        rate_limit_wait: 61
