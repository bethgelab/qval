[project]
name = "qval"
version = "0.1.0"
description = "Benchmark for evaluating dense signal functions in RL environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=0.25",
  "llenvs[litellm]",
  "scipy",
  "numpy",
  "pyyaml",
  "craftax",
  "harbor",
  "jericho",
  "transformers==5.5.2",
  "torch==2.10.0",
  "opencv-python-headless>=4.13.0",
  "vllm==0.19.1",
  "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
release = ["pyarrow", "pillow"]
all = ["llenvs[all]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qval"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv.sources]
llenvs = { path = "../llenvs", editable = true }
vllm = { index = "pypi" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
