dataset_path: shared/data/datasets/open_apps_vision/scripted_40traj_eps025_ms45_recovery_som_100pt_filtered_zeros_ranking.pkl
output_dir: data/evaluations/open_apps_vision/scripted_40traj_filtered_ranking_aug_vle_vip_liv

# Augmented OpenApps SoM dataset (94 eval + 94 ranking, fingerprint
# 3187264d6c64...). All predictions live alongside GT under the dataset
# directory; eval/ holds VLE+VIP+LIV outputs.
prediction_sources:
  - path: data/predictions/open_apps_vision/scripted_40traj_eps025_ms45_recovery_som_100pt_filtered_zeros_ranking/gt
    type: gt
  - path: data/predictions/open_apps_vision/scripted_40traj_eps025_ms45_recovery_som_100pt_filtered_zeros_ranking/eval
    type: eval

comparisons:
  - gt: sv_mc_mean
    eval:
      - vle_cosine_clip
      - vle_cosine_siglip
      - vle_gbr_clip
      - vle_gbr_siglip
      - vle_softmax_clip
      - vle_softmax_siglip
      - vle_thresh_clip
      - vle_thresh_siglip
      - vip_v
      - vip_shaped
      - liv_img_v_cos
      - liv_img_v_l2
      - liv_img_shaped_cos
      - liv_txt_v
      - liv_txt_shaped
  - gt: qv_mc_mean
    eval:
      - vip_q
      - liv_img_q_cos
      - liv_img_q_l2
      - liv_txt_q
