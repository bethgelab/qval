dataset_path: shared/data/datasets/frozen_lake_vision/8x8_scripted_20260420_152752.pkl
output_dir: data/evaluations/frozen_lake_vision/8x8_scripted_llm_all_g4-31-or

# Eval JSONs carry 100 values each (max_eval_points=100 on a 239-point
# dataset), so both pointwise and ranking GT were sliced to the first 100
# points in gt_first100/ (see scripts/… or inline helper).
prediction_sources:
    - path: data/predictions/frozen_lake_vision/8x8_scripted/gt_first100
      type: gt
    - path: data/predictions/frozen_lake_vision/8x8_scripted_llm_all_g4-31-or/eval
      type: eval

# Pointwise comparisons only — ranking methods are auto-paired against the
# ranking_gt_* families by evaluate.py.
comparisons:
    - gt: qv_mc_mean
      eval:
          - llm_direct_qv_optimal_g4-31-or
          - llm_direct_qv_optimal_batch4_packed_g4-31-or
          - llm_gvl_qv_optimal_g4-31-or
